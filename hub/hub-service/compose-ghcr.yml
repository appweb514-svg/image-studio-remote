# MLXBits Image Studio — hub Proxmox (Dokploy)
# Image construite par GitHub Actions (ghcr.io) — pas de build sur l'hôte.
services:
  studio-hub:
    image: ghcr.io/appweb514-svg/studio-hub:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # URLs du worker mflux (Mac mini), essayées dans l'ordre :
      # NetBird puis IP LAN (à compléter avec l'IP LAN de la mini).
      WORKER_URL: http://100.102.122.144:8899
      WORKER_TOKEN: klein-4b
      ADMIN_USER: gildas
      ADMIN_PASSWORD: Studio2026!
      STUDIO_DATA: /data
      WEBUI_DIST: /srv/webui
    volumes:
      - studio-data:/data
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.imgstudio.rule=Host(`imgstudio.int.labvirtuel.fr`)
      - traefik.http.routers.imgstudio.entrypoints=web
      - traefik.http.routers.imgstudio.service=imgstudio
      - traefik.http.services.imgstudio.loadbalancer.server.port=8000

networks:
  dokploy-network:
    external: true

volumes:
  studio-data:
