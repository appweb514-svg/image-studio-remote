name: Docker hub image

# Build & push the Proxmox hub image to GHCR whenever the hub or web UI changes.
on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "webui/**"
      - ".github/workflows/docker-hub.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/hub-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/studio-hub:latest
            ghcr.io/${{ github.repository_owner }}/studio-hub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
